add_newline = true
command_timeout = 200
format = """[\U000f08c7 ❯](yellow) [$directory]($style)${custom.git_source}$git_branch $git_status $fill $python $time
$character """

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold cyan)"

[fill]
symbol = '─'

[python]
format = "[${symbol}(<$virtualenv>)]($style)"

[time]
format = "[$time]($style)"
use_12hr = true
style = "yellow"
disabled = false

[directory]
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "bold yellow"

[custom.git_source]
description = "Nerdfont symbol for location of remote server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
  echo "\U0000e709 "
else
  echo "\U0000f1d3 "
fi
"""
when = "git rev-parse --is-inside-work-tree"

[git_branch]
format = "[$branch]($style)"
style = "green"

[git_status]
format     = "([$ahead_behind $all_status]($style))"
style      = "green"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "[ ${count}](red) "
untracked  = "[?${count}](blue) "
stashed    = "[S${count}](yellow) "
modified   = " ${count} "
staged     = "[+${count}](bright) "
renamed    = "→${count} "
deleted    = "X${count} "
