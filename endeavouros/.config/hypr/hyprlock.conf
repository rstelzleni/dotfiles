# hyprlock -- see https://wiki.hypr.land/Hypr-Ecosystem/hyprlock
# Classic hyprlang syntax -- hyprlock hasn't moved to the Lua config format,
# only Hyprland core has (same story as hypridle.conf).
#
# hyprlock needs *some* config file to exist to run at all (no built-in
# defaults)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    # Same accent gradient as general.col.active_border in looknfeel.lua
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90

    position = 0, 150
    halign = center
    valign = center
}
