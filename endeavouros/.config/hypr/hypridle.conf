# hypridle -- see https://wiki.hypr.land/Hypr-Ecosystem/hypridle
#
# Note: hypridle (like hyprlock and hyprpaper) hasn't moved to the new Lua
# config format -- only Hyprland core has. It still depends on `hyprlang`
# (check `pacman -Qi hypridle`), so this stays a classic .conf file.
#
# Long timeouts here since this is a desktop, not a laptop -- no rush to
# lock or dim.

general {
    lock_cmd = pidof hyprlock || hyprlock                                # don't stack multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                             # lock before suspend, in case something suspends manually
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # wake the screen on resume without needing a keypress
}

listener {
    timeout = 1200                                                       # 20 min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1320                                                       # 22 min -- shortly after lock
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Full suspend at 45 minutes
listener {
    timeout = 2700
    on-timeout = systemctl suspend
}
